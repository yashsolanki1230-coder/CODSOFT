<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anime World</title>
    <link rel="stylesheet" href="web.css">
</head>
<body>

    <header>
        <h1>Anime World</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Popular</a>
            <a href="#">Genres</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Welcome to Anime World</h2>
        <p>Discover your favorite anime characters and shows</p>
        <button>Explore Now</button>
    </section>

    <section class="anime-list">
        <div class="card">
            <img src="image.png" alt="Naruto">
            <h3>Naruto</h3>
        </div>

        <div class="card">
            <img src="onepiece.png" alt="Attack on Titan">
            <h3>One Piece</h3>
        </div>

        <div class="card">
            <img src="bleach.png" alt="Demon Slayer">
            <h3>Bleach</h3>
        </div>
    </section>

    <footer>
        <p>© 2026 Anime World | Made with Crunchy Roll</p>
    </footer>

</body>
</html>
